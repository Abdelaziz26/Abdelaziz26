{% extends 'admin/layout.html' %}
{% block admin_content %}
<h1>Products</h1>
<a class="btn" href="/admin/products/new">Add product</a>
<div class="grid">
  {% for product in products %}
  <div class="card">
    <strong>{{ product.name }}</strong>
    <p>${{ '%.2f' | format(product.price_cents / 100) }}</p>
    <a class="btn ghost" href="/admin/products/{{ product.id }}">Edit</a>
    <a class="btn ghost" href="/admin/products/{{ product.id }}/variants">Variants</a>
  </div>
  {% endfor %}
</div>
{% endblock %}
