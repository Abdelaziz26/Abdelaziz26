{% extends 'admin/layout.html' %}
{% block admin_content %}
<h1>Variants for {{ product.name }}</h1>
<a class="btn" href="/admin/products/{{ product.id }}/variants/new">Add variant</a>
<div class="grid">
  {% for variant in variants %}
  <div class="card">
    <strong>{{ variant.sku }}</strong>
    <p>{{ variant.color }} / {{ variant.size }}</p>
    <p>Stock: {{ variant.stock }}</p>
    <a class="btn ghost" href="/admin/variants/{{ variant.id }}">Edit</a>
  </div>
  {% endfor %}
</div>
{% endblock %}
