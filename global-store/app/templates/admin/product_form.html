{% extends 'admin/layout.html' %}
{% block admin_content %}
<h1>{{ 'Edit' if product else 'New' }} Product</h1>
<form method="post" class="form">
  <input type="hidden" name="csrf_token" value="{{ request.cookies.get('csrf_token') }}" />
  <input name="name" placeholder="Name" value="{{ product.name if product }}" required />
  <input name="slug" placeholder="Slug" value="{{ product.slug if product }}" required />
  <textarea name="description" placeholder="Description" required>{{ product.description if product }}</textarea>
  <input name="price_cents" type="number" placeholder="Price cents" value="{{ product.price_cents if product }}" required />
  <select name="category_id" required>
    {% for category in categories %}
    <option value="{{ category.id }}" {% if product and product.category_id == category.id %}selected{% endif %}>{{ category.name }}</option>
    {% endfor %}
  </select>
  <label><input type="checkbox" name="is_active" {% if product and product.is_active %}checked{% endif %}/> Active</label>
  <button class="btn" type="submit">Save</button>
</form>
{% if product %}
<form method="post" action="/admin/products/{{ product.id }}/delete">
  <input type="hidden" name="csrf_token" value="{{ request.cookies.get('csrf_token') }}" />
  <button class="btn ghost" type="submit">Delete</button>
</form>
<h2>Images</h2>
<form method="post" action="/admin/products/{{ product.id }}/images" class="form">
  <input type="hidden" name="csrf_token" value="{{ request.cookies.get('csrf_token') }}" />
  <input name="url" placeholder="Image URL" required />
  <input name="alt" placeholder="Alt text" />
  <input name="sort_order" type="number" placeholder="Sort order" />
  <button class="btn" type="submit">Add image</button>
</form>
<div class="grid">
  {% for image in images %}
  <div class="card">
    <img src="{{ image.url }}" alt="{{ image.alt }}" />
    <form method="post" action="/admin/products/{{ product.id }}/images/{{ image.id }}/delete">
      <input type="hidden" name="csrf_token" value="{{ request.cookies.get('csrf_token') }}" />
      <button class="btn ghost" type="submit">Remove</button>
    </form>
  </div>
  {% endfor %}
</div>
{% endif %}
{% endblock %}
