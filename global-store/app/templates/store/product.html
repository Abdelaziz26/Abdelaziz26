{% extends 'base.html' %}
{% block content %}
<section class="section product-detail" data-product-id="{{ product.id }}">
  <div class="gallery">
    {% if product.images %}
      <img id="main-image" src="{{ product.images[0].url }}" alt="{{ product.images[0].alt }}" />
      <div class="thumbs">
        {% for image in product.images %}
        <button class="thumb" data-src="{{ image.url }}">
          <img src="{{ image.url }}" alt="{{ image.alt }}" />
        </button>
        {% endfor %}
      </div>
    {% else %}
      <div class="placeholder"></div>
    {% endif %}
  </div>
  <div class="buy-box">
    <h1>{{ product.name }}</h1>
    <p>{{ product.description }}</p>
    <div class="price">${{ '%.2f' | format(product.price_cents / 100) }}</div>
    <label for="variant">Variant</label>
    <select id="variant" aria-label="Select variant">
      {% for variant in product.variants %}
      <option value="{{ variant.id }}">{{ variant.color }} / {{ variant.size }} ({{ variant.stock }} in stock)</option>
      {% endfor %}
    </select>
    <label for="qty">Qty</label>
    <input id="qty" type="number" value="1" min="1" />
    <button id="add-to-cart" class="btn">Add to cart</button>
  </div>
</section>
<script defer src="/static/js/product.js"></script>
{% endblock %}
