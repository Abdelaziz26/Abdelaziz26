<div id="cart-drawer" class="cart-drawer" role="dialog" aria-modal="true" aria-hidden="true" aria-label="Cart">
  <div class="cart-header">
    <h2>Your Cart</h2>
    <button id="cart-close" class="ghost" aria-label="Close cart">✕</button>
  </div>
  <div id="cart-items" class="cart-items"></div>
  <div class="cart-footer">
    <div class="cart-total">Total: <span id="cart-total">$0.00</span></div>
    <a class="btn" href="/checkout">Checkout</a>
    <a class="btn ghost" href="/cart">View Cart</a>
  </div>
</div>
<div id="cart-backdrop" class="backdrop" aria-hidden="true"></div>
