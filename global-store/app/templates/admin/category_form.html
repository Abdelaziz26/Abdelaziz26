{% extends 'admin/layout.html' %}
{% block admin_content %}
<h1>{{ 'Edit' if category else 'New' }} Category</h1>
<form method="post" class="form">
  <input type="hidden" name="csrf_token" value="{{ request.cookies.get('csrf_token') }}" />
  <input name="name" placeholder="Name" value="{{ category.name if category }}" required />
  <input name="slug" placeholder="Slug" value="{{ category.slug if category }}" required />
  <button class="btn" type="submit">Save</button>
</form>
{% if category %}
<form method="post" action="/admin/categories/{{ category.id }}/delete">
  <input type="hidden" name="csrf_token" value="{{ request.cookies.get('csrf_token') }}" />
  <button class="btn ghost" type="submit">Delete</button>
</form>
{% endif %}
{% endblock %}
