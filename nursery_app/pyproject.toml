[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nursery-management-app"
version = "0.1.0"
description = "Cross-platform desktop Nursery Management app"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7.0",
  "SQLAlchemy>=2.0.30",
  "alembic>=1.13.1",
  "pydantic>=2.7.0",
  "passlib[bcrypt]>=1.7.4",
  "python-dateutil>=2.9.0.post0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "black>=24.4.0",
  "ruff>=0.4.0",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
