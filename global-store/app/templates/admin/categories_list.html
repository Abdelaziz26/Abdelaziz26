{% extends 'admin/layout.html' %}
{% block admin_content %}
<h1>Categories</h1>
<a class="btn" href="/admin/categories/new">Add category</a>
<div class="grid">
  {% for category in categories %}
  <div class="card">
    <strong>{{ category.name }}</strong>
    <p>{{ category.slug }}</p>
    <a class="btn ghost" href="/admin/categories/{{ category.id }}">Edit</a>
  </div>
  {% endfor %}
</div>
{% endblock %}
